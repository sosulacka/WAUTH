# ============================================================
#  WAUTH — регистрация и авторизация
#  Цвета: &a, &#F0FFAB, &x&F&0&F&F&A&B
#  Время: "45s" / "45", "500ms", "2m", "1h"
# ============================================================

security:
  # Вырезать из консоли строки с командами, содержащими пароль.
  hide-passwords-in-console: true
  # Limits survive reconnects, but reset at server restart. Settings require a full restart.
  rate-limit:
    window: 300s
    account-attempts: 10
    ip-attempts: 40
    registrations-per-ip: 5
  workers:
    threads: 2
    queue-capacity: 32

storage:
  migration:
    # Remove imported .db files only after a verified backup and successful SQLite import.
    remove-legacy-files: true
  # Current data is stored in data/auth.sqlite. Legacy files are backed up before import.
  # Keep sqlite.migrated: it prevents restoring stale legacy data if auth.sqlite disappears.
  # Changing encryption rewrites both tables at startup and requires the original key.
  # Шифровать локальную базу аккаунтов (AES-256/GCM).
  # Ключ хранится в plugins/WAUTH/data/store.key — не удаляйте его.
  encrypt: true
  # Стоимость bcrypt. 10-12 — разумный баланс скорости и надёжности.
  bcrypt-cost: 12
  # Интервал записи метаданных входа. Пароли и изменения 2FA сохраняются сразу.
  save-interval: 60s

auth:
  # Сколько даётся на вход/регистрацию.
  timeout: 45s
  # Количество попыток ввода пароля. 0 — без ограничений.
  max-attempts: 3
  # Как часто напоминать в чате.
  reminder-interval: 10s
  # Показывать таймер в action bar.
  show-actionbar: true

  password:
    min-length: 6
    max-length: 64
    # Регулярное выражение; пустая строка — проверка отключена.
    pattern: ''
    # Запретить пароль, совпадающий с ником.
    forbid-name: true
    # Запретить простые пароли из списка ниже.
    reject-weak: true
    weak-list:
      - '123456'
      - '12345678'
      - '1234567890'
      - 'password'
      - 'qwerty'
      - 'qwerty123'
      - '111111'
      - 'abc123'
      - 'iloveyou'
      - 'admin'

  # Ограничения игрока до авторизации.
  freeze:
    block-movement: true
    block-camera: true
    block-jump: true
    block-sprint: true
    block-interaction: true
    block-chat: true
    # Неуязвимость до авторизации. Применяется отменой событий урона и НЕ
    # устанавливает флаг Invulnerable игроку — после входа ничего не "залипает".
    invulnerable: true
    no-push: true
    blindness: false

  # Наказание при истечении времени или попыток.
  punishment:
    # KICK или BAN
    type: KICK
    ban-duration: 300s

  # Автовход после недавнего выхода.
  session:
    enabled: true
    duration: 600s
    # Жёсткий срок жизни сессии: по истечении игрок обязан войти заново,
    # даже если запись сессии не была удалена вовремя.
    # 0 — использовать значение duration.
    timeout: 600s
    require-same-ip: true

  # Команды, разрешённые до авторизации (без слеша).
  allowed-commands:
    - register
    - reg
    - login
    - l
    - wauth
    - wa
    - 2fa

confirmation:
  enabled: true
  timeout: 30s
  require-for:
    changepass: true
    forcechangepass: true
    forceresetpass: true

# ============================================================
#  Двухфакторная аутентификация (2FA) через мессенджеры.
#  Подтверждение входа кнопкой в ЛС: Telegram, VK и Discord —
#  все боты работают внутри плагина, внешних сервисов не нужно.
# ============================================================
twofa:
  # Главный выключатель. Без него весь блок ниже не поднимается.
  enabled: false
  # Игрокам с правом wauth.2fa.required вход без привязки 2FA запрещён.
  enforce-permission: true
  # Сколько живёт код/веб-сессия привязки.
  link-timeout: 600s
  # Сколько ждём подтверждения входа из мессенджера.
  confirm-timeout: 120s
  # Сколько резервных кодов выдавать при привязке.
  backup-codes-count: 8

  # Встроенный HTTP: сайт настройки привязки 2FA.
  http:
    enabled: true
    tunnel: false
    # Поднять сайт прямо на порту игрового сервера (server.properties → server-port).
    # Плагин различает HTTP- и Minecraft-соединения по первым байтам и разводит их сам —
    # отдельный порт открывать не нужно. Если внедриться в сеть сервера не удалось,
    # автоматически поднимется отдельный сервер на host/port ниже (в консоли будет предупреждение).
    share-server-port: true
    # Запасные host/port на случай, если share-server-port выключен или не сработал.
    host: 127.0.0.1
    port: 8654
    # Публичный адрес сайта настройки (что уходит игроку ссылкой).
    # При share-server-port укажите адрес и порт сервера, например http://play.example.ru:25565
    public-url: 'http://127.0.0.1:25565'

  telegram:
    # Bot username without @; blank shows a placeholder.
    username: ''
    enabled: false
    # Токен бота от @BotFather.
    token: ''

  vk:
    enabled: false
    # Токен сообщества (Long Poll API + сообщения).
    token: ''
    # Числовой ID сообщества.
    group-id: 0

  discord:
    enabled: false
    # Токен бота из Discord Developer Portal (Bot → Token).
    # Боту нужен интент DIRECT MESSAGES; привилегированные интенты не требуются.
    # Игрок должен иметь общий сервер с ботом, чтобы тот мог писать ему в ЛС.
    token: ''

